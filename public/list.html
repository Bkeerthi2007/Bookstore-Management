<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Collection | Keerthi Book Heaven</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="list-page"></body>

<header>
    <h1>📚 Keerthi Book Heaven</h1>
    <p>Discover Your Next Favourite Book</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="insert.html">Add Book</a>
    <a href="list.html">View Books</a>
    <a href="list1.html">Book Details</a>
    <a href="search.html">Search</a>
</nav>

<main>
    <h2>Our Book Collection</h2>
    <p>Explore all the books available in our library.</p>

    <div id="bookList">Loading books...</div>
</main>

<script>
async function loadBooks() {
    const container = document.getElementById("bookList");

    try {
        const response = await fetch("/books");
        const books = await response.json();

        if (!books.length) {
            container.innerHTML = "<p>No books available.</p>";
            return;
        }

        container.innerHTML = `
            <div style="overflow-x:auto">
            <table style="width:100%;border-collapse:collapse">
                <thead>
                    <tr style="color:#f3d77a">
                        <th style="padding:10px">ID</th>
                        <th style="padding:10px">Title</th>
                        <th style="padding:10px">Author</th>
                        <th style="padding:10px">Category</th>
                        <th style="padding:10px">Price</th>
                        <th style="padding:10px">Stock</th>
                    </tr>
                </thead>
                <tbody>
                    ${books.map(book => `
                        <tr>
                            <td style="padding:10px">${book.book_id}</td>
                            <td style="padding:10px">${book.title}</td>
                            <td style="padding:10px">${book.author}</td>
                            <td style="padding:10px">${book.category}</td>
                            <td style="padding:10px">₹${book.price}</td>
                            <td style="padding:10px">${book.stock}</td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
            </div>
            <p>Total Books: ${books.length}</p>
        `;
    } catch (error) {
        container.innerHTML = "<p>Unable to load books. Check the server.</p>";
    }
}

loadBooks();
</script>

</body>
</html>

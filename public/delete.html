<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Book | Keerthi Book Heaven</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="delete-page"></body>
    <header>
        <h1>Keerthi Book Heaven</h1>
        <p>Luxury Library Management</p>
    </header>

    <main>
        <h2>Delete a Book</h2>
        <p>Enter the Book ID you want to delete.</p>

        <form action="/delete" method="POST">
            <input type="number" name="book_id"
                   placeholder="Book ID" min="1" required>
            <button class="btn" type="submit">Delete Book</button>
        </form>

        <p><a href="index.html">Back to Home</a></p>
    </main>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Book - Keerthi Book Heaven</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="update-page">

    <header>
        <h1>Keerthi Book Heaven</h1>
        <h2>Update Book Details</h2>
        <p>Update your book information with ease.</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="insert.html">Insert Book</a>
        <a href="list.html">View Books</a>
        <a href="search.html">Search Book</a>
        <a href="delete.html">Delete Book</a>
    </nav>

    <main>
        <form action="/update" method="POST">

            <label for="book_id">Book ID</label>
            <input
                type="number"
                id="book_id"
                name="book_id"
                placeholder="Enter Book ID to update"
                required
            >

            <label for="title">Book Title</label>
            <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter book title"
                required
            >

            <label for="author">Author Name</label>
            <input
                type="text"
                id="author"
                name="author"
                placeholder="Enter author name"
                required
            >

            <label for="category">Category</label>
            <input
                type="text"
                id="category"
                name="category"
                placeholder="Enter book category"
                required
            >

            <label for="price">Price (₹)</label>
            <input
                type="number"
                id="price"
                name="price"
                placeholder="Enter price"
                min="0"
                step="0.01"
                required
            >

            <label for="stock">Stock Quantity</label>
            <input
                type="number"
                id="stock"
                name="stock"
                placeholder="Enter stock quantity"
                min="0"
                required
            >

            <button type="submit">Update Book</button>
            <button type="reset">Clear Form</button>

        </form>
    </main>

</body>
</html>
